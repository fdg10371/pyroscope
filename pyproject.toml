[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyroscope"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "xarray>=2024.10,<2025.7",
  "dask[array]>=2024.10",
  "zarr>=2.18,<3",
  "fsspec[http]>=2024.10",
  "numpy>=1.26",
  "Pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["pof_explorer"]

[tool.setuptools.package-data]
pof_explorer = ["static/*", "static/vendor/*", "static/vendor/images/*", "static/vendor/fonts/*"]
